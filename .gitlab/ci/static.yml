# Lint and the repository's static contracts (dead code, architecture, PR
# state policy, main-policy document, pipeline shape). The pipeline-shape
# contract proves this very pipeline's job roster, tags, topology, and tier
# selection from the checked-in CI files — this pipeline has no aggregate
# gate job, so the contract carries the silent-shrink protection GitHub's
# e2e-gate provides over there.

static:
  extends: .node-job
  stage: test
  timeout: 15 minutes
  cache:
    - !reference [.caches, pnpm-readonly]
  script:
    - pnpm run ci:test:static
  # The tool specs in this job report through the merge-request test widget the
  # same way the unit job's do. Its own file, not the unit job's, so the two
  # never clobber each other in a shared workspace layout.
  artifacts:
    when: always
    reports:
      junit: test-results/vitest-tools-junit.xml
