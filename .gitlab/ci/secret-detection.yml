# Gating secret detection. The CE Secret-Detection template ships the
# analyzer as report-only — findings never fail the job on this tier — so a
# second job replays the report through tools/gate-secret-detection.mjs and
# goes red on any finding the in-repo allowlist
# (.gitlab/secret-detection-allowlist.json) does not cover. Together they
# replace GitHub secret scanning, which dies at the repository's private flip.
#
# Both jobs carry the same rules on purpose: the gate `needs` the analyzer,
# and a needs edge into a job that is absent from the pipeline is a
# pipeline-creation error. Merge requests are the gate; pushes to main are
# scanned as well because pre-cutover main is dual-pushed by hand and its
# commits never pass a merge-request pipeline here.

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

secret_detection:
  # The shared runner takes tagged jobs only; the template ships none.
  tags:
    - docker
  interruptible: true
  # The template defaults to allow_failure: true because on the tiers where
  # findings gate elsewhere the job is only a data source. Here the gate
  # consumes its artifact, so an analyzer crash must be red, not a warning.
  allow_failure: false
  retry: !reference [.retries, infra-only]
  timeout: 15 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
  # Restated from the template (an artifacts override replaces the whole
  # block) plus an explicit retention window and when: always, so the report
  # that names a finding survives its own red pipeline.
  artifacts:
    access: developer
    when: always
    expire_in: 30 days
    reports:
      secret_detection: gl-secret-detection-report.json
    paths:
      - gl-secret-detection-report.json

secret-detection-gate:
  extends: .node-job
  stage: test
  timeout: 5 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
  # Dependency-free like the evaluator it runs: report in, verdict out — no
  # install, no caches.
  cache: []
  before_script: []
  needs:
    - job: secret_detection
      artifacts: true
  script:
    - node tools/gate-secret-detection.mjs
