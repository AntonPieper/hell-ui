unit:
  extends: .node-job
  stage: test
  timeout: 15 minutes
  cache:
    - !reference [.caches, pnpm-readonly]
    # Pull-push on purpose: unit compilation both reads and refreshes the
    # Angular cache, unlike the pnpm store it only consumes.
    - !reference [.caches, angular]
  script:
    - pnpm run ci:test:unit
  # The "All files" row of the coverage text reporter; first column is
  # statement coverage.
  coverage: '/All files[^|]*\|\s*([\d.]+)/'
  artifacts:
    when: always
    paths:
      - coverage/
    reports:
      junit: test-results/vitest-junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    expire_in: 7 days
