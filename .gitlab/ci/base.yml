# Shared plumbing for Node jobs. The image major must match .node-version,
# the runtime source of truth shared with the release machinery; pnpm comes
# from the root package.json packageManager pin via corepack, so the version
# used in CI can never drift from the workspace.

.caches:
  # pnpm store plus the corepack download, keyed to the lockfile.
  pnpm:
    key:
      files:
        - pnpm-lock.yaml
      prefix: pnpm
    paths:
      - .cache/corepack
      - .cache/pnpm-store
  # The Angular build cache is content-addressed and self-invalidating, so a
  # coarse lockfile key is enough — a stale entry costs time, never
  # correctness.
  angular:
    key:
      files:
        - pnpm-lock.yaml
      prefix: angular
    paths:
      - .angular/cache

.node-job:
  image: node:22
  tags:
    - docker
  interruptible: true
  variables:
    COREPACK_HOME: "$CI_PROJECT_DIR/.cache/corepack"
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    npm_config_store_dir: "$CI_PROJECT_DIR/.cache/pnpm-store"
  cache:
    - !reference [.caches, pnpm]
  before_script:
    - corepack enable
    - pnpm run ci:install
