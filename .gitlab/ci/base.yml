# Shared plumbing for Node jobs. The image major must match .node-version,
# the runtime source of truth shared with the release machinery; pnpm comes
# from the root package.json packageManager pin via corepack, so the version
# used in CI can never drift from the workspace.

.caches:
  # pnpm store plus the corepack download, keyed to the lockfile.
  pnpm:
    key:
      files:
        - pnpm-lock.yaml
      prefix: pnpm
    paths:
      - .cache/corepack
      - .cache/pnpm-store
  # The same pnpm cache, read-only. The store's contents are fully determined
  # by the lockfile the key is derived from, so a job that only installs the
  # workspace can never add anything a peer would miss — but with the default
  # pull-push policy it still re-archives and re-uploads the unchanged store
  # after every run (~25s/job). One pull-push holder per pipeline (build, which
  # every pipeline runs) repopulates the cache when the lockfile changes;
  # everything else pulls. A job that installs beyond the workspace lockfile
  # (package-consumer's fixtures) keeps pull-push.
  pnpm-readonly:
    key: !reference [.caches, pnpm, key]
    paths: !reference [.caches, pnpm, paths]
    policy: pull
  # The Angular build cache is content-addressed and self-invalidating, so a
  # coarse lockfile key is enough — a stale entry costs time, never
  # correctness.
  angular:
    key:
      files:
        - pnpm-lock.yaml
      prefix: angular
    paths:
      - .angular/cache

# Retry infrastructure failures only — a failing test or script exits with
# the job's own error and must stay red on the first run. A hung job is
# deliberately not retried: a timeout deserves eyes, not a second slot.
.retries:
  infra-only:
    max: 1
    when:
      - runner_system_failure
      - api_failure
      - scheduler_failure

.node-job:
  image: node:22
  tags:
    - docker
  interruptible: true
  retry: !reference [.retries, infra-only]
  # Default placement: the test set runs in every test pipeline — merge
  # requests, pushes to main, v* tags, scheduled and dispatched runs — and
  # never in the scheduled policy sweep, which runs exactly one job of its
  # own. Jobs with a placement of their own (the MR contract, the E2E tiers,
  # the release machinery, the sweep) override this list wholesale.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d/
    - if: $CI_PIPELINE_SOURCE == "schedule" && $PIPELINE_KIND == "default"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
  variables:
    COREPACK_HOME: "$CI_PROJECT_DIR/.cache/corepack"
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    npm_config_store_dir: "$CI_PROJECT_DIR/.cache/pnpm-store"
  cache:
    - !reference [.caches, pnpm]
  before_script:
    - corepack enable
    - pnpm run ci:install
