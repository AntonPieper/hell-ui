# The single release workflow for every registry and Release Projection. A
# tag push runs the publish-last graph: release gate and the immutable-release
# policy gate → GitHub Packages → every other configured Required Registry
# (npmjs when enabled) → draft and verify the GitHub prerelease → publish the
# GitHub prerelease. Both registry publish jobs download the same gate run's
# audited `release-package` artifact, so cross-registry byte-identity comes
# from literally sharing one tarball rather than from build determinism across
# separate gate runs. The GitHub Release body is an exact byte projection of
# the tagged Released Version Notes, decided by the fixture-tested policy in
# tools/release/release-projection.mjs; manual dispatch stays evidence-only.
#
# This file must keep the npm-publish.yml name: the npm trusted-publisher
# record pins the workflow filename (docs/release/npm-publishing.md).
name: Publish release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  # Publish-only runtime: the tarball is built by the shared release gate on
  # the CI Node runtime (the root .node-version file). Node 24 here keeps npm
  # trusted publishing (OIDC provenance) available for the publish command
  # itself; the publish jobs never build or run package scripts.
  NODE_VERSION: 24

jobs:
  release-gate:
    name: Release gate
    uses: ./.github/workflows/release-gate.yml

  # Publication trust gate (ADR 0003): nothing publishes while GitHub's
  # native immutable-release policy is unproven. The policy locks published
  # release tags and assets and attests them; it does not lock note text, so
  # the tagged Released Version Notes stay authoritative and
  # release-drift.yml watches the published projection against them.
  #
  # The gate runs before both registry publish jobs so a disabled policy costs
  # nothing but a blocked run, and it decides through the same fixture-tested
  # seam draft verification uses rather than a second shell implementation.
  # Evidence-only workflow_dispatch runs skip it along with the publish jobs;
  # see docs/release/release-immutability.md for remediation.
  release-immutability:
    name: Release immutability policy
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      # An unreadable policy leaves no evidence file, which the seam treats
      # exactly like missing evidence: the gate fails closed.
      - name: Capture the immutable-releases policy
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/immutable-releases" > "$RUNNER_TEMP/immutable-releases.json" ||
            rm -f "$RUNNER_TEMP/immutable-releases.json"

      - name: Require the enabled immutable-release policy
        run: node tools/release/release-projection.mjs policy "$RUNNER_TEMP/immutable-releases.json"

  publish-npm:
    name: Publish to npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.HELL_ENABLE_NPMJS_PUBLISH == 'true'
    # GitHub Packages publishes first; enabling the npmjs switch makes npmjs
    # a Required Registry that runs after it (ADR 0003). Nothing publishes
    # before the immutable-release policy is proven enabled.
    needs:
      - release-gate
      - release-immutability
      - publish-github-packages
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package tarball
        uses: actions/download-artifact@v8
        with:
          name: release-package
          path: release-package

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Verify package tarball and tag
        run: |
          set -euo pipefail
          tarball_count="$(find release-package -type f -name '*.tgz' | wc -l | tr -d ' ')"
          test "$tarball_count" = "1"

          # Absolute path: pnpm publish re-resolves a relative tarball path
          # from a different working directory and misreads it as a git spec.
          tarball="$(find "$PWD/release-package" -type f -name '*.tgz' -print -quit)"
          echo "HELL_RELEASE_TARBALL=${tarball}" >> "$GITHUB_ENV"

          package_name="$(tar -xOf "$tarball" package/package.json | node -e "let data = ''; process.stdin.on('data', (chunk) => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data).name));")"
          package_version="$(tar -xOf "$tarball" package/package.json | node -e "let data = ''; process.stdin.on('data', (chunk) => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data).version));")"
          test "${GITHUB_REF_NAME}" = "v${package_version}" || {
            echo "Tag ${GITHUB_REF_NAME} must match ${package_name} version v${package_version}."
            exit 1
          }
          test "$package_name" = "hell-ui" || {
            echo "Unexpected release tarball package: ${package_name}."
            exit 1
          }

      - name: Publish npm package
        run: |
          set -euo pipefail
          echo "Publishing hell-ui"
          pnpm publish "$HELL_RELEASE_TARBALL" --access public --provenance --no-git-checks

  publish-github-packages:
    name: Publish to GitHub Packages
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # Nothing publishes before the immutable-release policy is proven enabled.
    needs:
      - release-gate
      - release-immutability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download package tarball
        uses: actions/download-artifact@v8
        with:
          name: release-package
          path: release-package

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node for GitHub Packages
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com

      - name: Verify package tarball and tag
        run: |
          set -euo pipefail
          tarball_count="$(find release-package -type f -name '*.tgz' | wc -l | tr -d ' ')"
          test "$tarball_count" = "1"

          # Absolute path: pnpm publish re-resolves a relative tarball path
          # from a different working directory and misreads it as a git spec.
          tarball="$(find "$PWD/release-package" -type f -name '*.tgz' -print -quit)"
          echo "HELL_RELEASE_TARBALL=${tarball}" >> "$GITHUB_ENV"

          package_name="$(tar -xOf "$tarball" package/package.json | node -e "let data = ''; process.stdin.on('data', (chunk) => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data).name));")"
          package_version="$(tar -xOf "$tarball" package/package.json | node -e "let data = ''; process.stdin.on('data', (chunk) => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data).version));")"
          test "${GITHUB_REF_NAME}" = "v${package_version}" || {
            echo "Tag ${GITHUB_REF_NAME} must match ${package_name} version v${package_version}."
            exit 1
          }
          test "$package_name" = "hell-ui" || {
            echo "Unexpected release tarball package: ${package_name}."
            exit 1
          }
          echo "HELL_RELEASE_VERSION=${package_version}" >> "$GITHUB_ENV"

      # GitHub Packages only hosts npm packages scoped to the owning GitHub
      # account, so the unscoped canonical hell-ui name cannot publish there.
      # The GitHub Packages mirror publishes under the repository owner's
      # scope instead. The mirror republishes the exact audited release-gate
      # tarball with one metadata rewrite: package.json name and
      # publishConfig.registry target GitHub Packages; every other shipped
      # byte comes straight from the shared artifact. Internal hell-ui
      # peer/import names are untouched; consumers install the mirror through
      # npm aliases (see docs/release/npm-publishing.md).
      - name: Rewrite tarball metadata for GitHub Packages
        run: |
          set -euo pipefail
          rewrite_root="$PWD/ghpr-rewrite"
          mkdir -p "$rewrite_root"
          tar -xzf "$HELL_RELEASE_TARBALL" -C "$rewrite_root"
          test -f "$rewrite_root/package/package.json"
          node -e '
            const fs = require("node:fs");
            const path = process.argv[1];
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.name = "@antonpieper/hell-ui";
            pkg.publishConfig = { registry: "https://npm.pkg.github.com" };
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          ' "$rewrite_root/package/package.json"
          mkdir -p "$PWD/ghpr-package"
          mirror_tarball="$PWD/ghpr-package/antonpieper-hell-ui-${HELL_RELEASE_VERSION}.tgz"
          tar -czf "$mirror_tarball" -C "$rewrite_root" package
          echo "HELL_MIRROR_TARBALL=${mirror_tarball}" >> "$GITHUB_ENV"

      # Forensic record: keep the exact rewritten bytes the mirror publish
      # shipped (or attempted to ship) available for a short window without
      # pulling them back out of the registry.
      - name: Upload mirror tarball
        uses: actions/upload-artifact@v7
        with:
          name: release-package-github-mirror
          path: ghpr-package/*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Publish packages
        env:
          # The mirror publishes under the repository owner's scope, so the
          # default workflow token has packages:write for the namespace.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Publishing ${HELL_MIRROR_TARBALL}"
          pnpm publish "$HELL_MIRROR_TARBALL" --no-git-checks

  # Evidence-only manual runs: a dispatch exercises the full release gate and
  # the projection-verification plan against the current commit without
  # publishing a registry package, creating a draft, or touching GitHub
  # Releases.
  release-projection-plan:
    name: Release projection plan (evidence)
    if: github.event_name == 'workflow_dispatch'
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Plan the release projection from the current commit
        env:
          HELL_RELEASE_COMMIT: ${{ github.sha }}
        run: node tools/release/release-projection.mjs plan --evidence

  # The Required Registry barrier and the Release Projection draft. This job
  # runs even when a registry job failed or was skipped (`!cancelled()`) so
  # the fixture-tested policy in tools/release/release-projection.mjs blocks loudly:
  # a skipped, cancelled, or failed Required Registry fails the barrier step
  # before any GitHub release is touched. The draft body is the exact tagged
  # .changes/<version>.md bytes; a rerun adopts an existing release only when
  # it verifies exactly and never edits it.
  draft-github-release:
    name: Draft GitHub release
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - publish-github-packages
      - publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      release-id: ${{ steps.create.outputs.release-id || steps.decide.outputs.release-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      # Every configured Required Registry must have succeeded; a disabled
      # optional registry (npmjs while its publication switch is off) never
      # blocks. Future private registries join this list as required entries.
      - name: Require every Required Registry
        env:
          HELL_REQUIRED_REGISTRIES: >-
            [{"name": "GitHub Packages", "required": true,
              "result": "${{ needs.publish-github-packages.result }}"},
             {"name": "npmjs",
              "required": ${{ vars.HELL_ENABLE_NPMJS_PUBLISH == 'true' }},
              "result": "${{ needs.publish-npm.result }}"}]
        run: node tools/release/release-projection.mjs barrier

      - name: Plan the release projection
        env:
          HELL_RELEASE_TAG: ${{ github.ref_name }}
          HELL_RELEASE_COMMIT: ${{ github.sha }}
        run: node tools/release/release-projection.mjs plan > "$RUNNER_TEMP/expected.json"

      - name: Capture existing releases for the tag
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases" |
            jq --arg tag "$GITHUB_REF_NAME" '[.[][] | select(.tag_name == $tag)]' \
              > "$RUNNER_TEMP/existing.json"

      - name: Decide the projection action
        id: decide
        run: |
          set -euo pipefail
          decision="$(node tools/release/release-projection.mjs decide "$RUNNER_TEMP/expected.json" "$RUNNER_TEMP/existing.json")"
          echo "action=$(jq -r '.action' <<<"$decision")" >> "$GITHUB_OUTPUT"
          echo "release-id=$(jq -r '.releaseId // empty' <<<"$decision")" >> "$GITHUB_OUTPUT"

      - name: Create the draft prerelease
        id: create
        if: steps.decide.outputs.action == 'create'
        run: |
          set -euo pipefail
          release_id="$(
            jq '{tag_name: .tagName, name: .title, body: .body,
                 target_commitish: .commit, draft: true, prerelease: .prerelease}' \
              "$RUNNER_TEMP/expected.json" |
              gh api "repos/${GITHUB_REPOSITORY}/releases" --input - --jq '.id'
          )"
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Capture the release and repository policy
        env:
          HELL_RELEASE_ID: ${{ steps.create.outputs.release-id || steps.decide.outputs.release-id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/${HELL_RELEASE_ID}" > "$RUNNER_TEMP/release.json"
          gh api "repos/${GITHUB_REPOSITORY}/immutable-releases" > "$RUNNER_TEMP/immutable-releases.json" ||
            echo 'null' > "$RUNNER_TEMP/immutable-releases.json"
          echo "HELL_TAG_COMMIT=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq '.sha')" >> "$GITHUB_ENV"

      - name: Verify the draft projection
        run: |
          node tools/release/release-projection.mjs verify "$RUNNER_TEMP/expected.json" "$RUNNER_TEMP/release.json" \
            --phase projection --policy "$RUNNER_TEMP/immutable-releases.json"

  # Publishing the GitHub prerelease is the last release action. No
  # `always()`/`!cancelled()` here: this job runs only after the draft job —
  # and therefore the Required Registry barrier and every draft verification
  # — succeeded. A rerun over an already-published exact release verifies it
  # without editing.
  publish-github-release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: draft-github-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HELL_RELEASE_ID: ${{ needs.draft-github-release.outputs.release-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Plan the release projection
        env:
          HELL_RELEASE_TAG: ${{ github.ref_name }}
          HELL_RELEASE_COMMIT: ${{ github.sha }}
        run: node tools/release/release-projection.mjs plan > "$RUNNER_TEMP/expected.json"

      - name: Capture the verified draft
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/${HELL_RELEASE_ID}" > "$RUNNER_TEMP/release.json"
          gh api "repos/${GITHUB_REPOSITORY}/immutable-releases" > "$RUNNER_TEMP/immutable-releases.json" ||
            echo 'null' > "$RUNNER_TEMP/immutable-releases.json"
          echo "HELL_TAG_COMMIT=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq '.sha')" >> "$GITHUB_ENV"

      - name: Verify the draft projection before publication
        run: |
          node tools/release/release-projection.mjs verify "$RUNNER_TEMP/expected.json" "$RUNNER_TEMP/release.json" \
            --phase projection --policy "$RUNNER_TEMP/immutable-releases.json"

      - name: Publish the GitHub prerelease
        run: |
          set -euo pipefail
          if [ "$(jq -r '.draft' "$RUNNER_TEMP/release.json")" = "true" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${HELL_RELEASE_ID}" \
              -F draft=false --jq '.id' > /dev/null
          else
            echo "The release is already published; this rerun verifies it without editing."
          fi

      - name: Verify the published projection
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/${HELL_RELEASE_ID}" > "$RUNNER_TEMP/published.json"
          node tools/release/release-projection.mjs verify "$RUNNER_TEMP/expected.json" "$RUNNER_TEMP/published.json" \
            --phase published
