packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
catalog:
  # The Angular toolchain is held below 22.1 and moves as one group (ADR §6).
  # Every stable @angular/cli 22.1.x depends on listr2 10.2.2 while its own
  # @listr2/prompt-adapter-inquirer 4.2.4 peer-requires listr2 10.2.1, and no
  # adapter release pairs with 10.2.2 — the tree is unsatisfiable under
  # --strict-peer-dependencies, so consumer fixtures cannot install. Re-probe
  # 22.1.4+/22.2 on the next sweep; these are the latest versions that work.
  "@angular/build": "~22.0.9"
  "@angular/cdk": "~22.0.7"
  "@angular/cli": "~22.0.9"
  "@angular/common": "~22.0.8"
  "@angular/compiler": "~22.0.8"
  "@angular/compiler-cli": "~22.0.8"
  "@angular/core": "~22.0.8"
  "@angular/forms": "~22.0.8"
  "@angular/platform-browser": "~22.0.8"
  "@angular/router": "~22.0.8"
  "@axe-core/playwright": "^4.12.1"
  "@codemirror/commands": "^6.10.4"
  "@codemirror/lang-javascript": "^6.2.5"
  "@codemirror/language": "^6.12.4"
  "@codemirror/state": "^6.7.1"
  "@codemirror/view": "^6.43.8"
  "@eslint/js": "^10.0.1"
  "@floating-ui/dom": "^1.8.0"
  "@lezer/highlight": "^1.2.3"
  "@microsoft/api-extractor": "^7.58.12"
  "@ng-icons/core": "^34.0.0"
  "@ng-icons/font-awesome": "^34.0.0"
  # Pinned to the minor the CI browser images are built for: the GitHub E2E job
  # runs mcr.microsoft.com/playwright:v1.62.1-noble and GitLab builds
  # e2e:v1.62.1-node22. A resolution past 1.62.x installs a browser revision
  # neither image carries and every E2E test fails to launch, so bumping
  # Playwright means moving both images in the same change. Tilde, not
  # caret: a caret lets a lock refresh cross the coupling silently.
  "@playwright/test": "~1.62.1"
  "@tailwindcss/postcss": "^4.3.3"
  "@tanstack/angular-table": "^9.0.0"
  "@tanstack/virtual-core": "^3.17.7"
  "@vitest/coverage-v8": "4.1.10"
  "angular-eslint": "^22.1.0"
  "eslint": "^10.8.0"
  "jsdom": "^30.0.1"
  "knip": "^6.31.0"
  "ng-packagr": "~22.0.2"
  "ng-primitives": "0.128.7"
  "pdfjs-dist": "6.2.108"
  "postcss": "^8.5.25"
  "rxjs": "~7.8.2"
  "tailwind-merge": "^3.6.0"
  "tailwindcss": "^4.3.3"
  "tslib": "^2.8.1"
  "typescript": "~6.0.3"
  "typescript-eslint": "^8.66.0"
  "vitest": "4.1.10"
overrides:
  # ng-primitives (still true at 0.128.7) pins @phenomnomnominal/tsquery to
  # 6.1.3, whose peer range "^3 || ^4 || ^5" excludes the TypeScript 6 this
  # repo develops against; tsquery 6.2.0 relaxed it to ">3.0.0". Load-bearing:
  # without it `pnpm test:consumer-fixtures` fails outright, because fixtures
  # install with --strict-peer-dependencies. Retires when ng-primitives moves
  # that pin. Note this repairs only our own installs: adopters resolve the
  # peer from published metadata and do not inherit overrides, so the upstream
  # fix is the only thing that reaches them.
  "@phenomnomnominal/tsquery": "6.2.0"
packageExtensions:
  # ng-primitives/dialog imports @angular/router without declaring the peer.
  ng-primitives:
    peerDependencies:
      "@angular/router": ">=19.0.0"
