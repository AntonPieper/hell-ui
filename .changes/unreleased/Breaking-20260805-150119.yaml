kind: Breaking
body: 'Column pinning in the `hell-ui/table-tanstack` shell is now logical rather than physical: the shell publishes `data-pinned="start"` and `data-pinned="end"` instead of `"left"`/`"right"`, and every TanStack shell rule moved out of `hell-ui/table/styles.css` into the opt-in `hell-ui/table-tanstack/styles.css`, which positions pinned columns with `inset-inline-start`/`inset-inline-end`.'
time: 2026-08-05T15:01:19.962397+02:00
custom:
    migration: |-
        Update anything that selects or asserts on the pinned attributes: replace
        `[data-pinned='left']` with `[data-pinned='start']` and `[data-pinned='right']`
        with `[data-pinned='end']`. The `--hell-table-pinned-start` and
        `--hell-table-pinned-after` CSS variables keep their names. If you set TanStack
        pinning state yourself, its shape changed too: `columnPinning.left`/`.right`
        became `.start`/`.end`, and `column.pin('left' | 'right')` became
        `column.pin('start' | 'end')`. Because the shell now positions with logical
        inset properties, pinned columns follow the writing direction — under `dir="rtl"`
        a start-pinned column sticks to the right edge, where it previously stuck to the
        left, and the pinned-region boundary shadows flip with it so they keep casting
        toward the scrolling centre. If you restyled those shadows, they now read the
        `--hell-table-pinned-shadow-inline` custom property rather than hard-coded
        physical offsets.
        Every TanStack shell rule also moved out of `hell-ui/table/styles.css` into the
        opt-in `hell-ui/table-tanstack/styles.css` — not just pinning, but the toolbar and
        footer bars, the scrollport and its scrollbars, the shell table sizing, the status
        and expanded-row scaffolding, the filter search rows, the pagination controls and
        the virtual-row geometry. The default bundle no longer ships shell selectors to
        consumers with no TanStack table.
        If you render the shell you now need that stylesheet, in either style mode. Add
        `@import 'hell-ui/table-tanstack/styles.css';` — alongside `hell-ui/styles.css` if
        you use the Default Style Bundle, or in place of `hell-ui/table/styles.css` if you
        import entrypoint stylesheets granularly. It imports the base table styles itself,
        so it stays one import either way and the shared base still resolves once. Order is
        not significant beyond Hell's usual rule that theme adapter stylesheets come after
        the component CSS they adapt.
        Without it the shell still renders, but pinned columns lose sticky positioning and
        their boundary shadows, the scrollport loses its thin scrollbars, and the virtual
        row strategy loses the geometry that keeps its rows on the header grid.
