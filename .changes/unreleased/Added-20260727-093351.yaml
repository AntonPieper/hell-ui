kind: Added
body: 'Filter Builder field descriptors accept an optional `displayParts(filter)`
  callback returning `{ field, operator?, value }`. When present the chip renders
  muted field and operator segments plus an emphasized value segment through the new
  `tokenField`, `tokenOperator`, and `tokenValue` Public Parts; when absent the chip
  keeps rendering the flat `display(filter)` string. It is presentation-only: `display(filter)`
  remains the single source for accessible names and announcements, and duplicate
  detection stays identity-based.'
time: 2026-07-27T09:33:51.072404+02:00
