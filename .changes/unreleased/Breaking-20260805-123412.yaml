kind: Breaking
body: The tested range for the `@ng-icons/core` and `@ng-icons/font-awesome` integrations moved from `^33.0.0` to `^34.0.0`. Only consumers of icon-backed entry points are affected. (These packages are no longer declared as peers — see the integration-contract entry under Changed — so nothing enforces the range at install time; the library is built against v34.)
time: 2026-08-05T12:34:12.820539+02:00
custom:
    migration: Upgrade `@ng-icons/core` and `@ng-icons/font-awesome` to `^34.0.0`; both must move together.
