kind: Breaking
body: >-
  `hell-ui/time-picker` is rebuilt around scrollable unit columns. The
  `-`/`+` steppers and the fixed 00/15/30/45 minute-preset grid are removed;
  each visible unit now renders a `role="listbox"` column of `role="option"`
  values with a roving tab stop, selection-follows-focus arrows, typed-digit
  entry, and tap selection. `HellTimePickerPart` drops `units`, `unit`,
  `unitLabel`, `unitControl`, `unitValue`, `unitStep`, `minutePresets`, and
  `minutePreset`, and adds `columns`, `column`, `columnLabel`, `options`,
  and `option`. `HellTimePickerLabels` drops `decreaseUnit`, `increaseUnit`,
  `minutePresets`, and `minutePreset`, and adds `noTimeSelected`. New `min`,
  `max`, `minuteStep`, and `secondStep` inputs add inclusive same-day bounds
  and column granularity. A `null` value now renders a placeholder readout
  with no selection instead of a silent midnight readout; the first
  activation still commits one complete `HellTimeValue`.
time: 2026-07-27T10:00:00.000Z
custom:
  migration: >-
    Retarget Part Style Maps onto the new parts: `unitValue`, `unitStep`,
    and `minutePreset` refinements become `option`; `unit` and `unitControl`
    become `column` and `options`; `units` becomes `columns`. Replace the
    removed `decreaseUnit`, `increaseUnit`, `minutePresets`, and
    `minutePreset` label overrides with `noTimeSelected`. Render bespoke
    preset rows as consumer markup beside the picker, or set `minuteStep`
    for fixed granularity. Bind an explicit initial value where code relied
    on a `null` value rendering 00:00.
