kind: Changed
body: 'The package manifest now declares only the seven required core peers (`@angular/cdk`, `@angular/common`, `@angular/core`, `@angular/forms`, `@floating-ui/dom`, `ng-primitives`, `rxjs`). The twelve feature integrations that were declared as optional peers (Tailwind, Router, ng-icons, TanStack table/virtual, CodeMirror, pdf.js) are no longer declared at all: registries serving npm abbreviated metadata drop `peerDependenciesMeta`, so installers saw every optional peer as required — strict-peer installs failed on peers the consumer never used, and default-posture installs silently pulled in all twelve with their transitive closure. Install an integration alongside the entry point that uses it; the tested ranges per entry point are listed in the consumer guide''s integration table.'
time: 2026-08-10T10:48:00.000000+02:00
