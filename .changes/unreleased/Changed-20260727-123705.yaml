kind: Changed
body: >-
  Date Input now fills the native `placeholder` of inputs that do not author
  one, but only where a format is configured through `provideHellDateInputFormat`
  or the `format` input, and only with the text the active adapter returns from
  its new optional `placeholderHint` hook. Inputs without a configured format
  keep an empty placeholder exactly as before, an adapter that omits the hook
  suppresses the write, and authoring `placeholder=""` opts out. A placeholder is
  also never written onto an input that has no `aria-label`, no `aria-labelledby`
  (including an enclosing Field's), and no associated `<label>`, so a hint can
  never become an unnamed input's accessible name and hide the missing label from
  accessibility checks.
