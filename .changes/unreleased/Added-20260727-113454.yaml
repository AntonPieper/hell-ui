kind: Added
body: 'Date picker: the month and year in the calendar heading are now buttons. Activating
  one replaces the day grid with a month grid or a 24-year grid centred on the year
  in view, so a date years away takes a handful of interactions instead of paging
  month by month. Both drill-downs are keyboard-operable grids that honour `min`/`max`,
  and they add the `monthTrigger`, `yearTrigger`, `panel`, `panelCell`, and `panelOption`
  parts plus the `previousYears`, `nextYears`, `chooseMonth`, and `chooseYear` labels.'
