kind: Fixed
body: 'Date picker: a day that is both today and the selected date is readable again.
  Tailwind''s variant sort let the `today` text colour win over the selected one,
  so the day number was painted in its own background colour and disappeared. The
  `today` ring is scoped the same way, so a selected or in-range day no longer draws
  it inside the selection fill; a day that is only today keeps its ring.'
