kind: Added
body: '`HellDateRangePicker` now participates in Angular forms through one committed `value` model of type `HellDateRangeValue | null` (`{ start, end }`): bind it two-way with `[(value)]`, to a Signal Forms field with `[formField]`, or to `formControl`/`ngModel` via Angular''s built-in interoperability. A completed selection commits the model exactly once, while an in-progress selection (start picked, end pending) stays interaction state; external and form writes reflect into the calendar silently without re-emitting `startDateChange`/`endDateChange`. The picker also gained a `disabled` input driven by bound forms, a `required` input reflected as `data-required` and driven by a field''s `required()` metadata, and a `touch` output that marks bound fields and controls touched when focus leaves the picker. The template-driven `[startDate]`/`[endDate]` bindings remain unchanged for calendar-only use.'
